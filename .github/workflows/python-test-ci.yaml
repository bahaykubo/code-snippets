name: Python - Test - CI

env:
  CREDENTIALS: testuser=${{ secrets.TESTUSER }} testpassword=${{ secrets.TESTPASSWORD }} token=${{ secrets.TOKEN }} tokensecret=${{ secrets.TOKENSECRET }} key=${{ secrets.KEY }} keysecret=${{ secrets.KEYSECRET }}

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    uses: ./.github/workflows/check-for-changes.yaml
    with:
      filters: |
        requires-check:
          - 'python-test/**'
          - '.github/workflows/python-test-ci.yaml'

  test:
    needs: changes
    if: needs.changes.outputs.requires-check == 'true'
    defaults:
      run:
        working-directory: ./python-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install poetry
        run: pipx install poetry

      - name: Install packages
        run: poetry install

      - name: Install Playwright browsers
        run: poetry run playwright install --with-deps chromium

      - name: Lint with pylint
        if: always()
        run: poetry run pylint --recursive=y .

      - name: Run API tests
        if: always()
        run: ${{ env.CREDENTIALS }} poetry run python -m pytest -s --disable-warnings -v -n 2 -m blogpost

      - name: Run UI tests
        if: always()
        run: ${{ env.CREDENTIALS }} poetry run python -m pytest -s --disable-warnings -v -n 2 -m saucedemo
