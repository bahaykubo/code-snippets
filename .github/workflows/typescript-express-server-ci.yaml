name: Typescript - Express Server - CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  changes:
    uses: ./.github/workflows/check-for-changes.yaml
    with:
      filters: |
        requires-check:
          - 'typescript-express-server/**'
          - '.github/workflows/typescript-express-server-ci.yaml'

  test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.requires-check == 'true'
    defaults:
      run:
        working-directory: ./typescript-express-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install npm packages
        run: npm run ci

      - name: Lint app
        if: always()
        run: npm run lint

      - name: Build app
        run: |
          npm run build
          npm run refresh-data

      - name: Start app and run integration tests
        run: |
          ./scripts/docker/run.sh
          npm test
