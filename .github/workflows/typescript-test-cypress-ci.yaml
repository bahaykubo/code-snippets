name: Typescript - Test - Cypress

env:
  PASSWORDS: testpassword=${{ secrets.TESTPASSWORD }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'typescript-test-cypress/**'
      - '.github/workflows/typescript-test-cypress-ci.yaml'

jobs:
  test:
    defaults:
      run:
        working-directory: ./typescript-test-cypress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install npm packages
        run: npm run ci

      - name: Lint project
        if: always()
        run: npm run lint

      - name: Run API tests
        if: always()
        run: ${{ env.PASSWORDS }} npm test
