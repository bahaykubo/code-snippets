name: Typescript - Test - Playwright Mocha

env:
  PASSWORDS: testpassword=${{ secrets.TESTPASSWORD }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  changes:
    uses: ./.github/workflows/check-for-changes.yaml
    with:
      filters: |
        requires-check:
          - 'typescript-test-playwright-mocha/**'
          - '.github/workflows/typescript-test-playwright-mocha-ci.yaml'

  test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.requires-check == 'true'
    defaults:
      run:
        working-directory: ./typescript-test-playwright-mocha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install npm packages
        run: npm run ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Lint project
        if: always()
        run: npm run lint

      - name: Run API tests
        if: always()
        run: npm run test-api

      - name: Run UI tests
        if: always()
        run: ${{ env.PASSWORDS }} npm run test-ui-headless -- tests/ui
